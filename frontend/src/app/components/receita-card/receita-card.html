<div class="card h-100 shadow-sm">
  <div class="card-body d-flex flex-column">
    <span class="badge badge-categoria align-self-start mb-2">{{ nomeCategoria(receita().categoria) }}</span>
    <h5 class="card-title">{{ receita().nome }}</h5>
    <p class="card-text text-muted small">
      {{ receita().tempoPreparo }} min | {{ receita().porcoes }} {{ receita().porcoes === 1 ? 'porção' : 'porções' }}
    </p>
    <a class="btn btn-outline-danger mt-auto" [routerLink]="['/receita', receita().id]">Ver receita</a>
  </div>
</div>
